<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>VideoBrowser - Your Personal Video Navigator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>VideoBrowser</h1>
        <input type="file" id="fileInput" accept=".json">
        <button id="viewHistoryButton">View History</button>
    </header>
    <main>
        <div class="controls">
            <input type="search" id="searchBar" placeholder="Search by title, tags, or guides...">
            <select id="levelFilter">
                <option value="">All Levels</option>
                <option value="superbeginner">Super Beginner</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <select id="soundQualityFilter">
                <option value="">All Sound Qualities</option>
                <option value="podcast-friendly">Podcast-Friendly</option>
                <option value="other">Other</option>
            </select>
            <div class="filter-group">
                <label for="guideFilter">Filter by Guide:</label>
                <select id="guideFilter">
                    <option value="">All Guides</option>
                    <!-- Guide options will be populated by JavaScript -->
                </select>
            </div>
            <select id="sortOptions">
                <option value="difficultyScore">Sort by Difficulty</option>
                <option value="publishedAt">Sort by Newest</option>
                <option value="duration">Sort by Duration</option>
                <option value="title">Sort by Title</option>
            </select>
            <button id="clearFiltersButton">Clear Filters</button>
        </div>
        <div id="videoList" class="video-list">
            <!-- Video cards will be inserted here -->
        </div>
        <div class="pagination">
            <button id="muchEasierPage">Much Easier</button>
            <button id="prevPage">Easier</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPage">Harder</button>
            <button id="muchHarderPage">Much Harder</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 VideoBrowser</p>
    </footer>
    <!-- Popup Styles -->
    <style>
        .popup-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }

        .close-button {
            background: red;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            float: right;
        }
    </style>
    <script src="js/app.js" type="module"></script>
</body>
</html>
